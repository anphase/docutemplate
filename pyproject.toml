[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docutemplate"
version = "0.1.0"
description = "Fill PDF forms with Jinja templates stored in field tooltips"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "anphase"}]
dependencies = ["PyPDFForm>=3.5,<3.6", "pypdf>=6.21.4,<7", "Jinja2>=3.1.6,<4", "Pillow>=13"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
]

[project.optional-dependencies]
images = ["Pillow>=13"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
docutemplate = "docutemplate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docutemplate = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/docutemplate"]

[[tool.mypy.overrides]]
module = ["PyPDFForm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=docutemplate --cov-branch --cov-report=term-missing --cov-fail-under=90"
